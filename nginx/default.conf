# Balanceador de carga na frente das réplicas da API (round robin).

# DNS interno do Docker: o nome "api" devolve um IP por réplica do serviço.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream menu_api {
    zone menu_api 64k;
    # "resolve" reconsulta o DNS periodicamente, então réplicas adicionadas,
    # removidas ou recriadas (com IP novo) entram no rodízio sem reiniciar o
    # Nginx. Sem diretiva de algoritmo, o balanceamento é round robin.
    server api:3000 resolve;
    # Reaproveita conexões com as réplicas em vez de abrir uma por requisição.
    keepalive 64;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

    location / {
        proxy_pass http://menu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Se uma réplica cair, tenta a próxima. Por padrão o Nginx só repete
        # requisições idempotentes (GET, DELETE...), nunca um POST.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        # Mostra qual réplica respondeu: útil para ver o round robin.
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
