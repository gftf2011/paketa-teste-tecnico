services:
  api:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: menu
      MONGO_MAX_POOL_SIZE: 50
      MENU_CACHE_TTL_MS: 5000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Teste de carga (k6). Só sobe quando chamado: npm run load:<tipo>
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    environment:
      BASE_URL: http://api:3000
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
