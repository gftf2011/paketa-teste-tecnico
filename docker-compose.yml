services:
  # Balanceador de carga: única porta exposta da API, distribui as requisições
  # entre as réplicas em round robin (ver nginx/default.conf).
  nginx:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    init: true
    restart: unless-stopped
    # Várias instâncias atrás do Nginx; o cache de cada uma é sincronizado
    # pelo Redis Pub/Sub.
    deploy:
      replicas: ${API_REPLICAS:-3}
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: menu
      MONGO_MAX_POOL_SIZE: 50
      MENU_CACHE_TTL_MS: ${MENU_CACHE_TTL_MS:-5000}
      MENU_CACHE_REFRESH_DELAY_MS: ${MENU_CACHE_REFRESH_DELAY_MS:-50}
      REDIS_URL: redis://redis:6379
      # OpenTelemetry: envia para o serviço lgtm quando ele estiver rodando
      # (npm run up). Sem ele, as exportações falham em
      # silêncio e a API segue normal.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: menu-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_METRIC_EXPORT_INTERVAL: 10000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Canal Pub/Sub para invalidar o cache do menu em todas as instâncias.
  # Não guarda dados, então roda sem persistência.
  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Observabilidade: OTel Collector + Prometheus + Tempo + Loki + Grafana.
  # Só sobe com o profile "observability" (imagem de ~3,5 GB).
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: [observability]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/menu-api-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/menu-api.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/dashboards/menu-api:ro

  # Teste de carga (k6). Só sobe quando chamado: npm run load:<tipo>
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  mongo-data:
